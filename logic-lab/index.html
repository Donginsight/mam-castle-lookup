<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193d39"><title>逻辑实验室 · 每次一个好问题</title><style>
:root{--ink:#193d39;--muted:#5c716b;--paper:#f6f5ee;--line:#d8dfd5;--lime:#dceba8;--white:#fff;--orange:#a34b26}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:11px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--ink)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--ink);color:white;border-color:var(--ink)}.soft{background:var(--lime)}:focus-visible{outline:3px solid #cc812c;outline-offset:3px}header{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 22px 12px}.brand{font-weight:800;letter-spacing:-1px;font-size:23px}.brand small{display:block;letter-spacing:2px;font-size:10px}.badge{font-size:13px;color:var(--muted)}main{max-width:1000px;margin:auto;padding:18px 22px 100px}h1{font-size:clamp(30px,6vw,52px);line-height:1.2;letter-spacing:-1.6px;margin:15px 0}h2{font-size:25px;line-height:1.35}h3{font-size:21px;margin:8px 0}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted)}.muted{color:var(--muted);font-size:15px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center;margin-bottom:26px}.illustration{border:1px solid var(--line);border-radius:28px;background:var(--lime);padding:28px;position:relative;overflow:hidden;min-height:240px}.orbit{font-size:75px;line-height:1.3;letter-spacing:16px}.illustration strong{display:block;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{border-top:1px solid var(--line);padding-top:12px}.stat strong{display:block;font-size:27px}.stat span{font-size:14px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{padding:20px;text-align:left;border-radius:20px;display:block;width:100%;position:relative}.tile .num{font-size:12px;color:var(--muted);letter-spacing:2px}.tile .foot{display:flex;justify-content:space-between;margin-top:15px;font-size:14px}.bar{height:5px;background:#e9eee4;border-radius:8px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#6a8b55}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:25px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.options{display:grid;gap:12px;margin:22px 0}.option{text-align:left;padding:16px 18px;display:flex;align-items:center;gap:14px}.letter{border:1px solid var(--line);border-radius:9px;min-width:33px;text-align:center}.selected{border:2px solid var(--ink);background:#edf4db}.correct{border:2px solid #438060;background:#eff8f0}.wrong{border:2px solid #ad704e;background:#fff2eb}textarea{width:100%;min-height:110px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:14px;margin:9px 0;background:#fcfcf8}label{display:block}.hint{background:#f5f4e7;border-radius:14px;padding:15px;margin:15px 0}.feedback{background:#edf4e4;border-radius:16px;padding:18px;margin:18px 0}.feedback.bad{background:#fff1e8}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{font-size:15px}.pill{font-size:13px;border:1px solid var(--line);border-radius:30px;padding:4px 10px}.note{font-size:14px;line-height:1.6;border-left:3px solid #a4b56d;padding-left:14px;margin-top:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:4}.nav button{border:0;font-size:15px;padding:6px 18px}.nav .active{background:var(--lime)}.record{padding:18px 0;border-bottom:1px solid var(--line)}.record p{margin:7px 0}.warning{padding:12px;background:#fff0df;font-size:14px}.empty{padding:35px 12px;text-align:center}details{margin:12px 0}summary{cursor:pointer}a{color:inherit}#toast{position:fixed;top:10px;left:10px;right:10px;max-width:550px;margin:auto;z-index:10;background:var(--ink);color:white;border-radius:12px;padding:12px;display:none}.screenreader{position:absolute;left:-9999px}@media(max-width:650px){.hero{grid-template-columns:1fr;gap:16px}.illustration{min-height:160px;padding:20px}.orbit{font-size:48px}.grid{grid-template-columns:1fr}header{padding:15px 18px}main{padding:12px 18px 110px}.panel{padding:20px}.badge{font-size:11px}.nav button{padding:7px 13px}.stats{gap:8px}h1{font-size:36px}.sectionhead{align-items:flex-start}}@media print{header,.nav,button,#toast,.no-print{display:none!important}main{padding:0}.panel{break-inside:avoid;border:0}body{background:white}textarea{border:0;min-height:90px}}
</style></head><body><header><div class="brand">逻辑实验室<small>THINK · TEST · REVISE</small></div><span class="badge">每次一个好问题</span></header><div id="storage-warning" hidden class="warning">当前浏览器无法保存进度。离开前请在“记录”中导出备份。</div><main id="app"></main><nav class="nav" aria-label="主要导航"><button data-nav="home">学习地图</button><button data-nav="review">复习</button><button data-nav="records">记录</button><button data-nav="family">周末讨论</button></nav><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';const DATA={"modules": [{"title": "条件与结论", "sub": "把“如果”读明白", "tag": "游戏规则", "lesson": "一句条件规则，通常不能随意倒过来。先找前提，再找结论。"}, {"title": "反例侦探", "sub": "一句“所有”，经得住一个反例吗", "tag": "数学挑战", "lesson": "要推翻“所有A都是B”，只需找一个A不是B；许多支持例子还不等于证明。"}, {"title": "说完整理由", "sub": "让每一步都站得住", "tag": "数学与物理", "lesson": "检查结论是否真的从前提推出；结论碰巧正确，也可能理由错误。"}, {"title": "词语放大镜", "sub": "先把话说清，再判断真假", "tag": "生活与游戏", "lesson": "概念含糊会让争论跑偏。先明确范围、指标和词义。"}, {"title": "因果调查员", "sub": "一起发生，不等于谁导致谁", "tag": "羽毛球与实验", "lesson": "因果判断要考虑其他解释，并尽量比较可比的条件。"}, {"title": "证据与概率", "sub": "知道多少，就说到哪里", "tag": "数据侦探", "lesson": "小样本、样本偏差和缺少分母，都会让判断失真。"}, {"title": "公平讨论", "sub": "理解别人，也检验自己", "tag": "亲子讨论", "lesson": "先准确复述对方，再讨论理由；不同意观点，不等于否定对方。"}, {"title": "决策实验室", "sub": "把方法用到真实选择", "tag": "周末挑战", "lesson": "明确目标、约束和代价，比较方案，再设计可撤回的小试验。"}], "questions": [{"id": "1-1", "m": 0, "q": "冠军一定获得金色徽章。小明有金色徽章，可以确定他是冠军吗？", "options": ["可以", "不能确定", "可以确定他不是冠军"], "answer": 1, "hint": "有没有其他获得徽章的方式？", "explain": "规则只保证冠军有徽章，没有说徽章只属于冠军。"}, {"id": "1-2", "m": 0, "q": "只有完成教学关，才能进入竞技场。小林已经进入竞技场，可以推出什么？", "options": ["一定赢过比赛", "无法推出任何信息", "一定完成了教学关"], "answer": 2, "hint": "“只有”后面的条件是进入竞技场所必需的。", "explain": "进入竞技场需要完成教学关，因此已经进入就说明完成过。"}, {"id": "1-3", "m": 0, "q": "如果装备护盾，就能抵挡这一次攻击。小周没装备护盾，能确定他抵挡不了吗？", "options": ["能确定他会抵挡", "能", "不能，可能有其他防御方式"], "answer": 2, "hint": "规则有没有排除其他防御？", "explain": "没有护盾不等于没有其他方式。不能否定前提就否定结果。"}, {"id": "1-4", "m": 0, "q": "规则保证：按下蓝色按钮，门就打开。现在门没有打开，可以确定什么？", "options": ["没有按蓝色按钮", "按了红色按钮", "门已经打开"], "answer": 0, "hint": "如果按过蓝色按钮，会与哪条已知信息冲突？", "explain": "在规则成立的前提下，按蓝色按钮必然开门；门没开，所以没有按。"}, {"id": "1-5", "m": 0, "q": "满分一定进入决赛。未进入决赛的选手一定没有满分。这句话怎样？", "options": ["不成立", "只能看选手年龄", "成立"], "answer": 2, "hint": "试着假设他拿到了满分。", "explain": "若满分就必进决赛，与未进入矛盾，所以没有满分。"}, {"id": "1-6", "m": 0, "q": "通关者都有钥匙。想从“有钥匙”推出“通关”，还需要什么？", "options": ["钥匙数量很多", "钥匙很好看", "只有通关者才有钥匙"], "answer": 2, "hint": "要排除其他拿到钥匙的途径。", "explain": "加上只有通关者有钥匙，才可以倒推。"}, {"id": "2-1", "m": 1, "q": "“两个奇数相加一定是奇数。”哪个能推翻它？", "options": ["1＋3＝4", "2＋4＝6", "1＋2＝3"], "answer": 0, "hint": "反例首先必须满足原句的前提。", "explain": "1和3都是奇数，和却是偶数；一个反例就够了。"}, {"id": "2-2", "m": 1, "q": "“所有质数都是奇数。”哪个是反例？", "options": ["9", "15", "2"], "answer": 2, "hint": "要找一个既是质数又不是奇数的数。", "explain": "2是质数，也是偶数，满足反例的两个要求。"}, {"id": "2-3", "m": 1, "q": "观察了10只白天鹅，能证明所有天鹅都是白色吗？", "options": ["能证明没有黑天鹅", "能", "不能"], "answer": 2, "hint": "没有看到的天鹅也被检查过了吗？", "explain": "有限观察不能直接证明没有例外的全称命题。"}, {"id": "2-4", "m": 1, "q": "“所有四边形都有四条相等的边。”哪个反例合适？", "options": ["边长2和3的长方形", "正方形", "圆"], "answer": 0, "hint": "既要是四边形，也要不符合等边条件。", "explain": "长方形是四边形，但边长2和3并非四边相等。"}, {"id": "2-5", "m": 1, "q": "想证明“所有偶数的平方都是偶数”，更可靠的方法是？", "options": ["设偶数为2k，平方为2×(2k²)", "问三个朋友", "只算2、4、6"], "answer": 0, "hint": "怎样覆盖所有偶数，而不只是几个？", "explain": "任意整数k都适用这个式子，因而覆盖所有偶数。"}, {"id": "2-6", "m": 1, "q": "“有些学生喜欢羽毛球。”发现一位学生不喜欢，能推翻吗？", "options": ["可以证明没人喜欢", "能", "不能"], "answer": 2, "hint": "“有些”和“所有”的要求相同吗？", "explain": "存在一位不喜欢的人，不否定存在喜欢的人。"}, {"id": "3-1", "m": 2, "q": "所有队员都戴蓝帽。小雨是队员。因此小雨戴蓝帽。推理怎样？", "options": ["有效", "无效", "需要知道小雨成绩"], "answer": 0, "hint": "小雨是否属于规则涵盖的群体？", "explain": "全体队员的规则适用于队员小雨。"}, {"id": "3-2", "m": 2, "q": "有些队员戴蓝帽。小雨是队员。因此小雨戴蓝帽。推理怎样？", "options": ["无效", "只要帽子是蓝色就有效", "有效"], "answer": 0, "hint": "“有些”是否包括每一个队员？", "explain": "小雨可能属于戴帽者，也可能不属于，结论没有被保证。"}, {"id": "3-3", "m": 2, "q": "x²＝9，因此x＝3。遗漏了什么？", "options": ["没有遗漏", "x也可能是−3", "x一定是9"], "answer": 1, "hint": "有另一个数平方后也等于9吗？", "explain": "−3的平方也为9。没有非负等条件时，不能只保留3。"}, {"id": "3-4", "m": 2, "q": "A比B快，B比C快。比较的是同一场比赛的平均速度。可以推出？", "options": ["A比C快", "C比A快", "三者一样快"], "answer": 0, "hint": "同一指标下的大小关系能连接起来吗？", "explain": "同一指标下，A大于B，B大于C，因此A大于C。"}, {"id": "3-5", "m": 2, "q": "“他说得很流利，所以他的结论一定正确。”问题在哪？", "options": ["流利的人一定说错", "结论一定错误", "流利不能保证理由和事实正确"], "answer": 2, "hint": "表达方式与证据是否是同一件事？", "explain": "指出理由不足，不等于证明结论一定错。"}, {"id": "3-6", "m": 2, "q": "“这道题答案是8，因为我朋友也写8。”最好补什么？", "options": ["更多人写8", "从题目条件推出8的步骤", "朋友的昵称"], "answer": 1, "hint": "人数能替代推导吗？", "explain": "一致的答案不保证正确，需要能核查的推理步骤。"}, {"id": "4-1", "m": 3, "q": "“这个角色最强。”首先应该问？", "options": ["在哪个版本、模式，用什么指标比较", "角色是什么颜色", "谁声音最大"], "answer": 0, "hint": "“强”是胜率、伤害，还是容易操作？", "explain": "确定范围和比较指标，才能检验结论。"}, {"id": "4-2", "m": 3, "q": "“所有人都说这游戏好玩。”最该检查？", "options": ["游戏封面大小", "说话者衣服颜色", "“所有人”实际指哪些人"], "answer": 2, "hint": "几个朋友能代表所有人吗？", "explain": "群体范围不清，可能把局部意见夸大为普遍意见。"}, {"id": "4-3", "m": 3, "q": "“便宜就是划算。”评估时还需比较？", "options": ["广告次数", "质量、用途和总成本", "包装越亮越好"], "answer": 1, "hint": "低价格能满足需求吗？", "explain": "划算涉及得到的价值和付出的成本，不只是标价低。"}, {"id": "4-4", "m": 3, "q": "甲说“规则公平”，乙说“有人总输，所以不公平”。分歧可能是？", "options": ["把机会公平和结果相同混在一起", "公平一定要求人人都赢", "输了就说明被作弊"], "answer": 0, "hint": "规则公平一定使每个人结果相同吗？", "explain": "相同规则与相同结果不是同一概念，还要检查规则本身。"}, {"id": "4-5", "m": 3, "q": "“他不赞成方案A，所以他赞成方案B。”还可能怎样？", "options": ["不可能有第三种想法", "他一定没听懂", "他两个都不赞成"], "answer": 2, "hint": "备选方案只有两个吗？", "explain": "不支持A并不自动支持B，可能支持C或暂不表态。"}, {"id": "4-6", "m": 3, "q": "“每天运动有益，所以运动越多越好。”遗漏了？", "options": ["运动越久一定越好", "强度、恢复和适量等条件", "运动鞋颜色"], "answer": 1, "hint": "从“有益”能直接走到无限增加吗？", "explain": "有限条件下有益，不说明任何剂量都更好。"}, {"id": "5-1", "m": 4, "q": "换新球拍后赢了一场，能证明新球拍让水平提高吗？", "options": ["能", "还不能，对手和状态也可能不同", "能证明旧球拍有问题"], "answer": 1, "hint": "还发生了哪些变化？", "explain": "一次前后变化不足以排除其他解释。"}, {"id": "5-2", "m": 4, "q": "吃冰淇淋的人多时，游泳的人也多，可能共同原因是？", "options": ["冰淇淋必然让人游泳", "游泳必然让人买冰淇淋", "天气炎热"], "answer": 2, "hint": "什么因素可能同时影响两件事？", "explain": "炎热天气可能同时增加两种活动，相关不等于直接因果。"}, {"id": "5-3", "m": 4, "q": "比较两种球拍，哪种安排更合理？", "options": ["新球拍对新手，旧球拍对高手", "尽量保持对手、场地等相近，并多次交替比较", "只用新球拍打一次"], "answer": 1, "hint": "除了球拍，哪些条件也影响结果？", "explain": "控制其他条件并重复比较，能减少混杂与偶然影响。"}, {"id": "5-4", "m": 4, "q": "高分学生更常用某学习App，所以App一定提升成绩？", "options": ["一定", "不一定，原本自律的学生可能更愿意用", "说明App一定无效"], "answer": 1, "hint": "使用者原先就可能不同吗？", "explain": "自律或基础差异可能同时影响使用与成绩。"}, {"id": "5-5", "m": 4, "q": "队伍更新战术后胜率提高，同时对手变弱。能把提升全归战术吗？", "options": ["能", "说明战术必然有害", "不能，需要区分对手变化的影响"], "answer": 2, "hint": "有没有同时变化的因素？", "explain": "对手变弱也能提高胜率，当前证据无法分离两个因素。"}, {"id": "5-6", " function persistDraft(){if(session)state.draft=JSON.parse(JSON.stringify(session));save()}
function resume(){const d=state.draft;if(!d||!Array.isArray(d.ids)||!d.ids.every(id=>DATA.questions.some(q=>q.id===id))||!Number.isInteger(d.index)||d.index<0||d.index>=d.ids.length){state.draft=null;save();toast('草稿已失效，请重新开始');return}session=d;page='quiz';render()}
function quiz(){const q=DATA.questions.find(q=>q.id===session.ids[session.index]);const lesson=DATA.modules[q.m].lesson;app.innerHTML=`<div class="row"><button id="back">← 地图</button><span class="muted">${esc(session.label)}</span></div><div class="sectionhead"><span class="eyebrow">本轮 ${session.index+1} / ${session.ids.length}</span><span class="pill">${session.submitted?'检查推理':'先自己想'}</span></div><div class="bar"><i style="width:${(session.index+1)/session.ids.length*100}%"></i></div><details><summary class="muted">想先复习一下方法？</summary><p>${esc(lesson)}</p></details><section class="panel"><h2>${esc(q.q)}</h2><div class="options" role="group" aria-label="选择答案">${q.options.map((o,i)=>`<button class="option ${session.choice===i?'selected':''} ${session.submitted&&i===q.answer?'correct':''} ${session.submitted&&session.choice===i&&i!==q.answer?'wrong':''}" data-choice="${i}" aria-pressed="${session.choice===i}" ${session.submitted?'disabled':''}><span class="letter">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><label for="reason"><strong>你为什么这样选？</strong><span class="muted"> 写一句理由，也可以写“我卡在……”</span></label><textarea id="reason" maxlength="2000" placeholder="我根据……，所以……" ${session.submitted?'readonly':''}>${esc(session.reason)}</textarea>${!session.submitted?`<div class="muted">你对答案有多确定？（可选）</div><div class="row">${['不太确定','大概确定','很确定'].map((x,i)=>`<button class="${session.confidence===i?'soft':''}" data-confidence="${i}">${x}</button>`).join('')}</div><div class="row" style="margin-top:20px"><button id="hint">${session.hint?'提示已展开':'给我一点提示'}</button><button class="primary" id="submit">提交并检查 →</button></div>`:''}${session.hint?`<div class="hint"><strong>一级提示：</strong>${esc(q.hint)}</div>`:''}${session.submitted?`<div class="feedback ${session.choice===q.answer?'':'bad'}" role="status"><strong>${session.choice===q.answer?'选择题答对了 · 再检查理由':'这是一次发现问题的机会'}</strong><p>参考选择：${'ABC'[q.answer]} · ${esc(q.options[q.answer])}</p><p>${esc(q.explain)}</p></div><p><strong>读完后，你能解释这一步了吗？</strong></p><p class="muted">这是自我检查，系统没有判定你的文字理由是否正确。</p><div class="row">${[['yes','能自己解释'],['partly','还需提示'],['no','仍有疑问']].map(([v,t])=>`<button data-self="${v}" class="${session.self===v?'soft':''}">${t}</button>`).join('')}</div><button class="primary" id="next" style="margin-top:20px" ${!session.self?'disabled':''}>${session.index+1===session.ids.length?'完成本轮 →':'下一题 →'}</button>`:''}</section>`;document.getElementById('back').onclick=()=>nav('home');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{capture();session.choice=Number(b.dataset.choice);persistDraft();quiz()});document.getElementById('reason').oninput=()=>{session.reason=document.getElementById('reason').value;persistDraft()};document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{capture();session.confidence=Number(b.dataset.confidence);persistDraft();quiz()});document.getElementById('hint')?.addEventListener('click',()=>{capture();session.hint=true;persistDraft();quiz()});document.getElementById('submit')?.addEventListener('click',submit);document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{session.self=b.dataset.self;const a=state.attempts[session.attemptIndex];if(a)a.self=session.self;persistDraft();quiz()});document.getElementById('next')?.addEventListener('click',next)}
function capture(){const el=document.getElementById('reason');if(el)session.reason=el.value}
function submit(){capture();if(session.choice===null){toast('先选择一个答案');return}if(!session.reason.trim()){toast('请写一句自己的理由，或写明卡在哪里');document.getElementById('reason').focus();return}if(session.submitted)return;const q=DATA.questions.find(q=>q.id===session.ids[session.index]);const a={id:q.id,choice:session.choice,reason:session.reason.trim(),confidence:session.confidence,hint:session.hint,self:null,date:new Date().toISOString()};state.attempts.push(a);session.attemptIndex=state.attempts.length-1;session.results.push(session.attemptIndex);session.submitted=true;persistDraft();quiz()}
function next(){if(!session.self)return;if(session.index+1===session.ids.length){state.draft=null;save();page='summary';render();return}session.index++;session.choice=null;session.reason='';session.confidence=null;session.hint=false;session.submitted=false;session.self=null;session.attemptIndex=null;persistDraft();render()}
function summary(){const result=session.results.map(i=>state.attempts[i]);const right=result.filter(a=>a.choice===DATA.questions.find(q=>q.id===a.id).answer).length;app.innerHTML=`<div class="eyebrow">本轮完成</div><h1>今天，想清楚了一点。</h1><section class="panel"><h2>选择题 ${right} / ${result.length} 答对</h2><p>选对只是第一步。你能不看解释，把理由说给别人听吗？</p><label for="reflection">留给周末讨论的一句话</label><textarea id="reflection" placeholder="我今天改变了一个想法…… / 我还有一个问题……" maxlength="2000"></textarea><button class="primary" id="finish">保存复盘，回到地图</button></section><p class="note">本轮结果不是智力评价。休息一下，比一次刷完所有题更重要。</p>`;document.getElementById('finish').onclick=()=>{const t=document.getElementById('reflection').value.trim();if(t&&result.length)result.at(-1).reflection=t;save();session=null;page='home';render()}}
function review(){const qs=reviewQs();app.innerHTML=`<div class="eyebrow">再想一次</div><h1>让疑问变成理解。</h1><p>这里收集选择题答错、尚未自评能解释的题。隔一两天再独立做，会更有意义。</p>${qs.length?`<button class="primary" id="startreview">复习 3 题 →</button><div class="panel">${qs.map(q=>`<div class="record"><span class="pill">${esc(DATA.modules[q.m].title)}</span><p>${esc(q.q)}</p></div>`).join('')}</div>`:'<div class="panel empty">暂时没有待复习题。<br><span class="muted">可以回学习地图，选择一个新主题。</span></div>'}`;document.getElementById('startreview')?.addEventListener('click',()=>start(qs.slice(0,3).map(q=>q.id),'复习 · 再想一次'))}
function report(){return '逻辑实验室 · 练习记录\n（选择题与自评记录，不是能力测评；进度仅在当前浏览器）\n\n'+state.attempts.map(a=>{const q=DATA.questions.find(q=>q.id===a.id);return `${new Date(a.date).toLocaleString('zh-CN')}｜${DATA.modules[q.m].title}\n题目：${q.q}\n我的选择：${q.options[a.choice]}（${a.choice===q.answer?'答对':'需复习'}）\n我的理由：${a.reason}\n自评：${{yes:'能解释',partly:'需提示',no:'有疑问'}[a.self]||'未完成'}\n${a.reflection?'复盘：'+a.reflection+'\n':''}`}).join('\n')}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function records(){app.innerHTML=`<div class="eyebrow">我的思考档案</div><h1>记录改变，不只记录对错。</h1><div class="row"><button id="exporttxt">导出文字记录</button><button id="backup">备份进度</button><button id="import">恢复备份</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="note">进度不跨设备自动同步。可以把文字记录发给家长；备份文件包含你写的理由，请自行保管。</p><section class="panel">${state.attempts.length?state.attempts.slice(-30).reverse().map(a=>{const q=DATA.questions.find(q=>q.id===a.id);return `<div class="record"><div class="row"><span class="pill">${a.choice===q.answer?'选择题答对':'待复习'}</span><span class="muted">${esc(new Date(a.date).toLocaleDateString('zh-CN'))} · ${esc(DATA.modules[q.m].title)}</span></div><p><strong>${esc(q.q)}</strong></p><p class="muted">我的选择：${esc(q.options[a.choice])}</p><p>我的理由：${esc(a.reason)}</p>${a.reflection?`<p>复盘：${esc(a.reflection)}</p>`:''}</div>`}).join(''):'<div class="empty">从第一轮开始，记录你的思考。</div>'}</section><details><summary class="muted">清除当前浏览器的数据</summary><p class="muted">清除后无法撤回，建议先导出备份。</p><button id="clear">清除练习记录</button></details>`;document.getElementById('exporttxt').onclick=()=>download('逻辑练习记录.txt',report(),'text/plain;charset=utf-8');document.getElementById('backup').onclick=()=>download('logic-lab-backup.json',JSON.stringify({attempts:state.attempts,draft:null},null,2),'application/json');document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>8e6){toast('文件过大，请使用本系统导出的备份');return}try{const x=JSON.parse(await f.text());if(!validState(x))throw Error();if(!confirm('用备份替换当前练习记录？建议先备份当前记录。'))return;state={attempts:x.attempts,draft:null};save();records();toast('备份已恢复')}catch(e){toast('备份格式无效，原记录没有改变')}};document.getElementById('clear').onclick=()=>{if(confirm('确定清除所有练习记录和草稿吗？')){state={attempts:[],draft:null};save();records();toast('当前记录已清除')}}}
function family(){app.innerHTML=`<div class="eyebrow">每个周末 · 15 分钟</div><h1>一起讨论，<br>不必争输赢。</h1><p>挑一个主题。先让孩子独立说，再用问题帮助他检查。可以打印本页带去学校。</p><button class="no-print" id="print">打印讨论卡</button>${DATA.modules.map((m,i)=>`<section class="panel"><span class="pill">第 ${i+1} 周建议 · 可自由调整</span><h2>${esc(m.title)}</h2><p>${esc(m.lesson)}</p><p><strong>讨论问题：</strong>${esc(DATA.questions.find(q=>q.m===i).q)}</p><p>① 我的结论是什么？<br>② 我根据哪些条件或证据？<br>③ 什么反例或新证据会改变它？</p><div style="height:70px;border-bottom:1px solid var(--line)"></div><p class="muted">家长提醒：先听完，不代答；肯定具体的推理与修正。讨论不是考试。</p></section>`).join('')}<p class="note">平日在校可用纸卡记录一个疑问；没有手机也能练习。每周题量可以按作业和休息情况调整。</p>`;document.getElementById('print').onclick=()=>window.print()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));render();
</script></body></html>
