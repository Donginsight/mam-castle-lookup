3},{"id":"T01-040","topic":0,"family":"可行情形计数","title":"规则并不只给出一个答案","stem":"密室的四条规则全部有效：\n1. “没有拿到钥匙”和“没有点亮信标”恰好一项成立。\n2. “启动升降台”和“没有打开侧门”恰好一项成立。\n3. “没有点亮信标”和“没有拿到钥匙”至少有一项成立（可以同时成立）。\n4. 如果启动升降台，那么点亮信标。\n四件事各只有“是/否”两种状态。共有多少组状态符合全部规则？","options":["5","2","3","4"],"answer":2,"steps":["四个二值状态共有 2×2×2×2＝16 种组合。","逐条剔除违反规则的组合。剩余如下：","拿到钥匙：否；打开侧门：否；启动升降台：否；点亮信标：是","拿到钥匙：否；打开侧门：是；启动升降台：是；点亮信标：是","拿到钥匙：是；打开侧门：否；启动升降台：否；点亮信标：否","因此共有 3 组；不同推导顺序不算不同状态。"],"why":["该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 3，不能跳过重叠、条件或限制。","该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 3，不能跳过重叠、条件或限制。","完整计算得到 3，与题目要求一致。","该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 3，不能跳过重叠、条件或限制。"],"hint":"不要只找到一组就停止；题目问所有可行状态。","lesson":"满足全部规则的状态称为可行情况。数量题要避免重复计数。","level":3},{"id":"T02-001","topic":1,"family":"复合否定","title":"否定整句话 · 场景 1","stem":"原句：“(带会员卡并且完成预约)，或者获得入场资格。”\n“或者”均包含同时成立。以下哪句话与原句的否定完全等价？","options":["没有带会员卡并且没有完成预约并且没有获得入场资格","没有获得入场资格，并且“没有带会员卡”或“没有完成预约”至少一项成立","带会员卡并且完成预约，但没有获得入场资格","获得入场资格，或者没有带会员卡"],"answer":1,"steps":["原句是“(A 且 B) 或 C”。要整句为假，两条成功路径都必须失败。","C 必须为假，同时“A 且 B”必须为假。","“A 且 B”为假只需 A、B 中至少一个为假，不要求两个都假。"],"why":["反例：带会员卡：否；完成预约：是；获得入场资格：否；通过检查：否。此时原句为假，而此选项为假，两者并非恰好相反，因此不等价于原句的否定。","与原句的真假恰好相反，覆盖全部反面情况，因此是真正的否定。","反例：带会员卡：否；完成预约：否；获得入场资格：否；通过检查：否。此时原句为假，而此选项为假，两者并非恰好相反，因此不等价于原句的否定。","反例：带会员卡：否；完成预约：否；获得入场资格：是；通过检查：否。此时原句为真，而此选项为真，两者并非恰好相反，因此不等价于原句的否定。"],"hint":"找一种“原句为假”的情况，检查选项是否恰好覆盖所有此类情况。","lesson":"否定不是说一句相反口气的话；它必须与原句在所有可能状态下真假相反。","level":2},{"id":"T02-002","topic":1,"family":"条件句反例","title":"否定整句话 · 场景 1","stem":"原句：“如果带会员卡，那么(完成预约或者获得入场资格)。”\n“或者”均包含同时成立。以下哪句话与原句的否定完全等价？","options":["没有带会员卡且没有完成预约且没有获得入场资格","没有带会员卡，但完成预约且获得入场资格","带会员卡，但没有完成预约且没有获得入场资格","带会员卡且完成预约，但没有获得入场资格"],"answer":2,"steps":["“如果 A，那么 B 或 C”只禁止一种情况：A 成立，而 B、C 都不成立。","前提 A 不成立时，不能用它来证明规则被违反。","因此否定要同时保留 A，并否定 B、C 两个后果。"],"why":["反例：带会员卡：否；完成预约：否；获得入场资格：否；通过检查：否。此时原句为真，而此选项为真，两者并非恰好相反，因此不等价于原句的否定。","反例：带会员卡：否；完成预约：是；获得入场资格：是；通过检查：否。此时原句为真，而此选项为真，两者并非恰好相反，因此不等价于原句的否定。","与原句的真假恰好相反，覆盖全部反面情况，因此是真正的否定。","反例：带会员卡：是；完成预约：否；获得入场资格：否；通过检查： 001","topic":8,"family":"百分比口径","title":"上涨多少有两种说法","stem":"训练任务的完成率从 20% 上升到 25%。下列哪种说法准确？","options":["增加 5%，相对增加 5 个百分点","增加 25 个百分点，相对增加 25%","增加 25 个百分点，相对增加 5%","增加 5 个百分点，相对增加 25%"],"answer":3,"steps":["绝对差＝25%−20%＝5 个百分点。","相对增幅＝(25−20)÷20×100%＝25%。","两种说法可以同时正确，但不能把单位互换。"],"why":["把百分比变化与百分点混用了，二者分母不同。","终值不是增加量；增加量应当用终值减初值。","交换了两个统计口径。先算差，再除以原来的比例。","百分点直接相减；相对增幅需要再除以原来的比例。"],"hint":"“百分点”做减法；“相对增长”要除以原数。","lesson":"每次看到“提高了百分之几”，先问它是在比较比例的差还是相对变化。","level":2},{"id":"T09-002","topic":8,"family":"加权平均","title":"不同人数不能平均百分比","stem":"两个班参加同一测验：甲班 100 人，达标率 80%；乙班 600 人，达标率 50%。合并两班后达标率是多少？","options":["65%","380/7%","50%","80%"],"answer":1,"steps":["甲班达标人数＝100×80%＝80；乙班＝600×50%＝300。","总人数＝700；总达标人数＝380。","合并达标率＝380/700×100%＝380/7%。"],"why":["该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 380/7%，不能跳过重叠、条件或限制。","完整计算得到 380/7%，与题目要求一致。","该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 380/7%，不能跳过重叠、条件或限制。","该数值与逐步计算不一致。请核对题目所问的对象和分母；正确计算得到 380/7%，不能跳过重叠、条件或限制。"],"hint":"用达标总人数除以总人数，不能只把两个百分比相加除以二。","lesson":"各组人数不同时，需要按人数加权。","level":2},{"id":"T09-003","topic":8,"family":"均值与中位数","title":"一个极端值改变了什么","stem":"五位同学一周的阅读分钟数从小到大为：10、12、13、15、100。哪项描述正确？","options":["最高值很大，因此至少一半人的数值高于 30","中位数是 13，它比平均数更不受最高值影响","删除最高值后，中位数仍必定是 13","平均数是 13，中位数是 30"],"answer":1,"steps":["五个数的中位数是第三个：13。","平均数＝150÷5＝30，受到最高值 100 的拉升。","删除最高值后只剩四个数，新中位数是 (12+13)÷2＝25/2，并不等于原中位数。"],"why":["平均数被极端值拉高，不意味着半数人高于平均数；本题只有最高值高于平均数。","中位数主要取决于排序位置；只提高最大值且不改变排序时，中位数不变。","删掉一个数会改变样本量的奇偶及中间位置，新中位数可能变化。","把两个统计量的定义倒置了。平均数是总和除以人数；中位数是中间位置。"],"hint":"分别计算中位数与平均数，再检查“删除”是否改变位置。","lesson":"中位数对极端值更稳健，但改变样本人数仍可能改变中位数。","level":2},{"id":"T09-004","topic":8,"family":"分组与总体","title":"每组更好，总体却更低","stem":"比较训练法 A、B 的达标记录：\n简单任务：A 为 9/10，B 为 72/90。\n困难任务：A 为 36/90，B 为 3/10。\n分子为达标数，分母为尝试数。以下哪项成立？","options":["由这些非随机分组记录可证明 A 对任何人都更有效","A 合并后一定高于 B，因为各组都更高","B 在两类任务内达标率都更高","A 在两类任务内达标率都更高，但合并后 A 为 45%、B 为 75%"],"answer":3,"steps":["简单任务：A＝90%，B＝80%；困难任务：A＝40%，B＝30%。A 在每一组都高。","但 A 的困难任务占 90%，B 的简单任务占 90%，两者权重不同。","A 合并为 45/100＝45%，B 合 "answer":3,"steps":["五个数的中位数是第三个：22。","平均数＝231÷5＝231/5，受到最高值 145 的拉升。","删除最高值后只剩四个数，新中位数是 (21+22)÷2＝43/2，并不等于原中位数。"],"why":["把两个统计量的定义倒置了。平均数是总和除以人数；中位数是中间位置。","平均数被极端值拉高，不意味着半数人高于平均数；本题只有最高值高于平均数。","删掉一个数会改变样本量的奇偶及中间位置，新中位数可能变化。","中位数主要取决于排序位置；只提高最大值且不改变排序时，中位数不变。"],"hint":"分别计算中位数与平均数，再检查“删除”是否改变位置。","lesson":"中位数对极端值更稳健，但改变样本人数仍可能改变中位数。","level":2},{"id":"T09-040","topic":8,"family":"分组与总体","title":"每组更好，总体却更低","stem":"比较训练法 A、B 的达标记录：\n简单任务：A 为 90/100，B 为 720/900。\n困难任务：A 为 360/900，B 为 30/100。\n分子为达标数，分母为尝试数。以下哪项成立？","options":["由这些非随机分组记录可证明 A 对任何人都更有效","A 合并后一定高于 B，因为各组都更高","B 在两类任务内达标率都更高","A 在两类任务内达标率都更高，但合并后 A 为 45%、B 为 75%"],"answer":3,"steps":["简单任务：A＝90%，B＝80%；困难任务：A＝40%，B＝30%。A 在每一组都高。","但 A 的困难任务占 90%，B 的简单任务占 90%，两者权重不同。","A 合并为 450/1000＝45%，B 合并为 750/1000＝75%。","这些记录描述分布，没有随机分配，不能直接推断所有人使用某方法的因果效果。"],"why":["观察记录未排除人的能力、任务选择等差异，不能作普遍因果保证。","当两种方法的组别权重不同时，这个推论不成立。","两类任务分别计算后，都是 A 更高。","分组内比例和总体比例都计算正确，差异来自任务难度构成不同。"],"hint":"先分别算四个比例，再算两种方法的总体分母。","lesson":"分组内优势不保证总体优势；比较方法时需要统一构成或作合理调整。","level":3},{"id":"T10-001","topic":9,"family":"替代解释","title":"羽毛球新球拍 · 替代解释","stem":"案例：羽毛球新球拍。\n自愿换新球拍的同学，一个月后平均多赢了两局；没换的同学没有明显变化。\n有人据此断言：“新球拍提高了比赛表现。”\n哪一项最直接指出原推断的关键缺口？","options":["如果没有发现反对证据，就应认定原因果主张成立","主要问题只是样本人数不够；扩大原调查即可排除所有其他解释","主动换球拍的人同时增加了训练时间","只要措施先发生、改善后发生，就足以确定因果关系"],"answer":2,"steps":["把原主张拆开：观察证据是“自愿换新球拍的同学，一个月后平均多赢了两局；没换的同学没有明显变化。”，结论则是“新球拍提高了比赛表现”。","关键替代解释：主动换球拍的人同时增加了训练时间。","改进检验：随机分配同水平同学使用两种球拍，并尽量统一训练时间与对手水平。","测量上还要注意：获胜局数还受对手水平影响，比较时需要统一或记录对手水平。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有发现反对证据不等于已经排除了替代解释，也不等于获得充分正面证据。","扩大有偏样本仍可能保留原偏差，人数不能替代研究设计。","这项直接针对当前问题：主动换球拍的人同时增加了训练时间。","先后顺序是判断因果的线索，但仍可能有共同原因或其他同步变化。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-002","topic":9,"family":"实验设计","title":"羽毛球新球拍 · 实验设计","stem":"案例：羽毛球新球拍。\n自愿换新球拍的同学，一个月后平均多赢了两局；没换的同学没有明显变化。\n有人据此断言：“新球拍提高了比赛表现。”\n哪种后续研究最能检验这个因果主张？","options":["继续扩大原有调查人数，其他设计完全不变","让使用措施的一组同时获得额外指导， 大原有调查人数，其他设计完全不变","让参与者自由选择分组，之后只比较两组最终结果","在难度相当的任务中随机安排有音乐和无音乐条件，保持时间一致"],"answer":3,"steps":["把原主张拆开：观察证据是“一个班本周播放轻音乐，同时换了更容易的练习卷，作业正确率提高。”，结论则是“播放轻音乐提高了正确率”。","关键替代解释：练习卷难度同时降低，无法区分哪个变化起作用。","改进检验：在难度相当的任务中随机安排有音乐和无音乐条件，保持时间一致。","测量上还要注意：任务正确率只有在难度可比时才能支持效果比较。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["同时改变措施和指导两个因素，无法区分哪个变化导致结果。","更多同类型观察可能提高精度，但不自动消除关键混杂。","自选分组可能让原有能力、动机或环境差异继续存在；只看终值也忽略基线。","这项直接针对当前问题：在难度相当的任务中随机安排有音乐和无音乐条件，保持时间一致。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-011","topic":9,"family":"结论边界","title":"晚自习音乐 · 结论边界","stem":"案例：晚自习音乐。\n一个班本周播放轻音乐，同时换了更容易的练习卷，作业正确率提高。\n有人据此断言：“播放轻音乐提高了正确率。”\n仅根据目前材料，最稳妥的结论是哪一项？","options":["已经证明：播放轻音乐提高了正确率这个说法必定错误","因为证据有局限，所以材料中的观察事实也必定虚假","已经证明：播放轻音乐提高了正确率","两项变化之后正确率上升，暂时不能把上升单独归因于音乐"],"answer":3,"steps":["把原主张拆开：观察证据是“一个班本周播放轻音乐，同时换了更容易的练习卷，作业正确率提高。”，结论则是“播放轻音乐提高了正确率”。","关键替代解释：练习卷难度同时降低，无法区分哪个变化起作用。","改进检验：在难度相当的任务中随机安排有音乐和无音乐条件，保持时间一致。","测量上还要注意：任务正确率只有在难度可比时才能支持效果比较。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有证明为真，不代表已经证明为假。","研究推论可能过强，但并不能据此宣布原始观察造假。","观察到结果不等于排除了其他原因。","这项直接针对当前问题：两项变化之后正确率上升，暂时不能把上升单独归因于音乐。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-012","topic":9,"family":"削弱证据","title":"晚自习音乐 · 削弱证据","stem":"案例：晚自习音乐。\n一个班本周播放轻音乐，同时换了更容易的练习卷，作业正确率提高。\n有人据此断言：“播放轻音乐提高了正确率。”\n如果新增信息属实，哪一项最能削弱原先的因果推断？","options":["另一个条件差异很大的群体没有观察到相同结果","原调查在更多同类参与者中得到相同的相关关系","换回原难度且保留音乐后，正确率回到原水平","一些参与者对措施感受不佳，但没有记录题目中的效果指标"],"answer":2,"steps":["把原主张拆开：观察证据是“一个班本周播放轻音乐，同时换了更容易的练习卷，作业正确率提高。”，结论则是“播放轻音乐提高了正确率”。","关键替代解释：练习卷难度同时降低，无法区分哪个变化起作用。","改进检验：在难度相当的任务中随机安排有音乐和无音乐条件，保持时间一致。","测量上还要注意：任务正确率只有在难度可比时才能支持效果比较。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["不可比群体的差异提示范围限制，但没有直接检验原场景中的因果解释。","重复观察可能支持关联稳定，但原有混杂可能依旧；这并不直接削弱主张。","这项直接针对当前问题：换回原难度且保留音乐后，正确率回到原水平。","主观不喜欢不等于目标效果没有改善，缺少指标连接。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-013","topic":9,"family":"替代解释","title":"运动与睡眠 · 替代解释","stem":"案例：运动与睡眠。\n问卷显示，睡得好的学生更常参加运动。\n有人据此断言：“运动改善了睡眠。”\n哪一项最直接指出原推断的关键缺口？","options":["主要问题只是样本人数不够；扩大原调查即可排除所有其他解释","如果没有发现反对证据，就应认定原因果主张成立","只要措施先发生、改善后发生，就足以确定因果关系","也可能是睡得好让人更有精力运动，因果方向尚不明确"],"answer":3,"steps":["把原主张拆开：观察证据是“问卷显示，睡得好的学生更常参加运动。”，结论则是“运动改善了睡眠”。","关键替代解释：也可能是睡得好让人更有精力运动，因果方向尚不明确。","改进检验：随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠。","测量上还要注意：睡眠好坏需要统一量表和记录周期，避免各人标准不同。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["扩大有偏样本仍可能保留原偏差，人数不能替代研究设计。","没有发现反对证据不等于已经排除了替代解释，也不等于获得充分正面证据。","先后顺序是判断因果的线索，但仍可能有共同原因或其他同步变化。","这项直接针对当前问题：也可能是睡得好让人更有精力运动，因果方向尚不明确。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-014","topic":9,"family":"实验设计","title":"运动与睡眠 · 实验设计","stem":"案例：运动与睡眠。\n问卷显示，睡得好的学生更常参加运动。\n有人据此断言：“运动改善了睡眠。”\n哪种后续研究最能检验这个因果主张？","options":["让参与者自由选择分组，之后只比较两组最终结果","继续扩大原有调查人数，其他设计完全不变","随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠","让使用措施的一组同时获得额外指导，再与原条件组比较"],"answer":2,"steps":["把原主张拆开：观察证据是“问卷显示，睡得好的学生更常参加运动。”，结论则是“运动改善了睡眠”。","关键替代解释：也可能是睡得好让人更有精力运动，因果方向尚不明确。","改进检验：随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠。","测量上还要注意：睡眠好坏需要统一量表和记录周期，避免各人标准不同。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["自选分组可能让原有能力、动机或环境差异继续存在；只看终值也忽略基线。","更多同类型观察可能提高精度，但不自动消除关键混杂。","这项直接针对当前问题：随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠。","同时改变措施和指导两个因素，无法区分哪个变化导致结果。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-015","topic":9,"family":"结论边界","title":"运动与睡眠 · 结论边界","stem":"案例：运动与睡眠。\n问卷显示，睡得好的学生更常参加运动。\n有人据此断言：“运动改善了睡眠。”\n仅根据目前材料，最稳妥的结论是哪一项？","options":["已经证明：运动改善了睡眠这个说法必定错误","因为证据有局限，所以材料中的观察事实也必定虚假","已经证明：运动改善了睡眠","运动频率与睡眠有关，方向及其他共同因素仍需检验"],"answer":3,"steps":["把原主张拆开：观察证据是“问卷显示，睡得好的学生更常参加运动。”，结论则是“运动改善了睡眠”。","关键替代解释：也可能是睡得好让人更有精力运动，因果方向尚不明确。","改进检验：随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠。","测量上还要注意：睡眠好坏需要统一量表和记录周期，避免各人标准不同。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有证明为真，不代表已经证明为假。","研究推论可能过强，但并不能据此宣布原始观察造假。","观察到结果不等于排除了其他原因。","这项直接针对当前问题：运动频率与睡眠有关，方向及其他共同因素仍需检验。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-016","topic":9,"family":"削弱证据","title":"运动与睡眠 · 削弱证据","stem":"案例：运动与睡眠。\n问卷显示，睡得好的学生更常参加运动。\n有人据此断言：“运动改善了睡眠。”\n如果新增信息属实，哪一项最能削弱原先的因果推断？","options":["另一个条件差异很大的群体没有观察到相同结果","一些参与者对措施感受不佳，但没有记录题目中的效果指标","持续记录发现，先出现睡眠改善，随后运动才增加，而运动增加后睡眠未继续改善","原调查在更多同类参与者中得到相同的相关关系"],"answer":2,"steps":["把原主张拆开：观察证据是“问卷显示，睡得好的学生更常参加运动。”，结论则是“运动改善了睡眠”。","关键替代解释：也可能是睡得好让人更有精力运动，因果方向尚不明确。","改进检验：随机分配适宜的运动计划与对照条件，记录开始前及之后的睡眠。","测量上还要注意：睡眠好坏需要统一量表和记录周期，避免各人标准不同。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["不可比群体的差异提示范围限制，但没有直接检验原场景中的因果解释。","主观不喜欢不等于目标效果没有改善，缺少指标连接。","这项直接针对当前问题：持续记录发现，先出现睡眠改善，随后运动才增加，而运动增加后睡眠未继续改善。","重复观察可能支持关联稳定，但原有混杂可能依旧；这并不直接削弱主张。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-017","topic":9,"family":"替代解释","title":"班级奖励 · 替代解释","stem":"案例：班级奖励。\n只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。\n有人据此断言：“鼓励卡造成了成绩回升。”\n哪一项最直接指出原推断的关键缺口？","options":["如果没有发现反对证据，就应认定原因果主张成立","只要措施先发生、改善后发生，就足以确定因果关系","主要问题只是样本人数不够；扩大原调查即可排除所有其他解释","按一次极低成绩选人，后续即使没有干预也可能向平常水平回归"],"answer":3,"steps":["把原主张拆开：观察证据是“只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。”，结论则是“鼓励卡造成了成绩回升”。","关键替代解释：按一次极低成绩选人，后续即使没有干预也可能向平常水平回归。","改进检验：从同样低分且基础相近的学生中随机分配鼓励卡组和对照组。","测量上还要注意：用多次既往成绩评估基础，避免只用一次异常低分作为基线。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有发现反对证据不等于已经排除了替代解释，也不等于获得充分正面证据。","先后顺序是判断因果的线索，但仍可能有共同原因或其他同步变化。","扩大有偏样本仍可能保留原偏差，人数不能替代研究设计。","这项直接针对当前问题：按一次极低成绩选人，后续即使没有干预也可能向平常水平回归。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-018","topic":9,"family":"实验设计","title":"班级奖励 · 实验设计","stem":"案例：班级奖励。\n只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。\n有人据此断言：“鼓励卡造成了成绩回升。”\n哪种后续研究最能检验这个因果主张？","options":["让使用措施的一组同时获得额外指导，再与原条件组比较","让参与者自由选择分组，之后只比较两组最终结果","继续扩大原有调查人数，其他设计完全不变","从同样低分且基础相近的学生中随机分配鼓励卡组和对照组"],"answer":3,"steps":["把原主张拆开：观察证据是“只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。”，结论则是“鼓励卡造成了成绩回升”。","关键替代解释：按一次极低成绩选人，后续即使没有干预也可能向平常水平回归。","改进检验：从同样低分且基础相近的学生中随机分配鼓励卡组和对照组。","测量上还要注意：用多次既往成绩评估基础，避免只用一次异常低分作为基线。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["同时改变措施和指导两个因素，无法区分哪个变化导致结果。","自选分组可能让原有能力、动机或环境差异继续存在；只看终值也忽略基线。","更多同类型观察可能提高精度，但不自动消除关键混杂。","这项直接针对当前问题：从同样低分且基础相近的学生中随机分配鼓励卡组和对照组。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-019","topic":9,"family":"结论边界","title":"班级奖励 · 结论边界","stem":"案例：班级奖励。\n只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。\n有人据此断言：“鼓励卡造成了成绩回升。”\n仅根据目前材料，最稳妥的结论是哪一项？","options":["发卡之后成绩回升，但自然波动等解释还没有排除","已经证明：鼓励卡造成了成绩回升","因为证据有局限，所以材料中的观察事实也必定虚假","已经证明：鼓励卡造成了成绩回升这个说法必定错误"],"answer":0,"steps":["把原主张拆开：观察证据是“只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。”，结论则是“鼓励卡造成了成绩回升”。","关键替代解释：按一次极低成绩选人，后续即使没有干预也可能向平常水平回归。","改进检验：从同样低分且基础相近的学生中随机分配鼓励卡组和对照组。","测量上还要注意：用多次既往成绩评估基础，避免只用一次异常低分作为基线。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["这项直接针对当前问题：发卡之后成绩回升，但自然波动等解释还没有排除。","观察到结果不等于排除了其他原因。","研究推论可能过强，但并不能据此宣布原始观察造假。","没有证明为真，不代表已经证明为假。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-020","topic":9,"family":"削弱证据","title":"班级奖励 · 削弱证据","stem":"案例：班级奖励。\n只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。\n有人据此断言：“鼓励卡造成了成绩回升。”\n如果新增信息属实，哪一项最能削弱原先的因果推断？","options":["一些参与者对措施感受不佳，但没有记录题目中的效果指标","原调查在更多同类参与者中得到相同的相关关系","另一个同样低分但没收到卡片的随机对照组也回升了相近幅度","另一个条件差异很大的群体没有观察到相同结果"],"answer":2,"steps":["把原主张拆开：观察证据是“只给上次成绩最低的一组发放鼓励卡，下一次这组平均成绩回升。”，结论则是“鼓励卡造成了成绩回升”。","关键替代解释：按一次极低成绩选人，后续即使没有干预也可能向平常水平回归。","改进检验：从同样低分且基础相近的学生中随机分配鼓励卡组和对照组。","测量上还要注意：用多次既往成绩评估基础，避免只用一次异常低分作为基线。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["主观不喜欢不等于目标效果没有改善，缺少指标连接。","重复观察可能支持关联稳定，但原有混杂可能依旧；这并不直接削弱主张。","这项直接针对当前问题：另一个同样低分但没收到卡片的随机对照组也回升了相近幅度。","不可比群体的差异提示范围限制，但没有直接检验原场景中的因果解释。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-021","topic":9,"family":"替代解释","ti 稳定，但原有混杂可能依旧；这并不直接削弱主张。","不可比群体的差异提示范围限制，但没有直接检验原场景中的因果解释。","这项直接针对当前问题：随机实验中，提示组与无提示组所有新玩家的通关率相同。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-037","topic":9,"family":"替代解释","title":"实验肥料 · 替代解释","stem":"案例：实验肥料。\n给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。\n有人据此断言：“新肥比旧肥更能促进生长。”\n哪一项最直接指出原推断的关键缺口？","options":["如果没有发现反对证据，就应认定原因果主张成立","新旧肥料组的光照不同，光照可能解释生长差异","主要问题只是样本人数不够；扩大原调查即可排除所有其他解释","只要措施先发生、改善后发生，就足以确定因果关系"],"answer":1,"steps":["把原主张拆开：观察证据是“给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。”，结论则是“新肥比旧肥更能促进生长”。","关键替代解释：新旧肥料组的光照不同，光照可能解释生长差异。","改进检验：将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水。","测量上还要注意：应记录相同时间内的生长增量，而非只看最终高度。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有发现反对证据不等于已经排除了替代解释，也不等于获得充分正面证据。","这项直接针对当前问题：新旧肥料组的光照不同，光照可能解释生长差异。","扩大有偏样本仍可能保留原偏差，人数不能替代研究设计。","先后顺序是判断因果的线索，但仍可能有共同原因或其他同步变化。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-038","topic":9,"family":"实验设计","title":"实验肥料 · 实验设计","stem":"案例：实验肥料。\n给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。\n有人据此断言：“新肥比旧肥更能促进生长。”\n哪种后续研究最能检验这个因果主张？","options":["让使用措施的一组同时获得额外指导，再与原条件组比较","继续扩大原有调查人数，其他设计完全不变","让参与者自由选择分组，之后只比较两组最终结果","将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水"],"answer":3,"steps":["把原主张拆开：观察证据是“给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。”，结论则是“新肥比旧肥更能促进生长”。","关键替代解释：新旧肥料组的光照不同，光照可能解释生长差异。","改进检验：将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水。","测量上还要注意：应记录相同时间内的生长增量，而非只看最终高度。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["同时改变措施和指导两个因素，无法区分哪个变化导致结果。","更多同类型观察可能提高精度，但不自动消除关键混杂。","自选分组可能让原有能力、动机或环境差异继续存在；只看终值也忽略基线。","这项直接针对当前问题：将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-039","topic":9,"family":"结论边界","title":"实验肥料 · 结论边界","stem":"案例：实验肥料。\n给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。\n有人据此断言：“新肥比旧肥更能促进生长。”\n仅根据目前材料，最稳妥的结论是哪一项？","options":["已经证明：新肥比旧肥更能促进生长这个说法必定错误","本次新肥组生长更快，但肥料与光照的影响尚未分开","已经证明：新肥比旧肥更能促进生长","因为证据有局限，所以材料中的观察事实也必定虚假"],"answer":1,"steps":["把原主张拆开：观察证据是“给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。”，结论则是“新肥比旧肥更能促进生长”。","关键替代解释：新旧肥料组的光照不同，光照可能解释生长差异。","改进检验：将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水。","测量上还要注意：应记录相同时间内的生长增量，而非只看最终高度。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["没有证明为真，不代表已经证明为假。","这项直接针对当前问题：本次新肥组生长更快，但肥料与光照的影响尚未分开。","观察到结果不等于排除了其他原因。","研究推论可能过强，但并不能据此宣布原始观察造假。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T10-040","topic":9,"family":"削弱证据","title":"实验肥料 · 削弱证据","stem":"案例：实验肥料。\n给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。\n有人据此断言：“新肥比旧肥更能促进生长。”\n如果新增信息属实，哪一项最能削弱原先的因果推断？","options":["另一个条件差异很大的群体没有观察到相同结果","在相同光照条件下重复实验，新旧肥料组的生长速度几乎相同","原调查在更多同类参与者中得到相同的相关关系","一些参与者对措施感受不佳，但没有记录题目中的效果指标"],"answer":1,"steps":["把原主张拆开：观察证据是“给窗边盆栽施新肥，给角落盆栽施旧肥，窗边盆栽长得更快。”，结论则是“新肥比旧肥更能促进生长”。","关键替代解释：新旧肥料组的光照不同，光照可能解释生长差异。","改进检验：将相同品种、初始大小相近的植物随机分配肥料，控制光照与浇水。","测量上还要注意：应记录相同时间内的生长增量，而非只看最终高度。","即使更好的研究没有发现差异，也要结合样本量和不确定性判断；它削弱当前证据，不是永久证明无效。"],"why":["不可比群体的差异提示范围限制，但没有直接检验原场景中的因果解释。","这项直接针对当前问题：在相同光照条件下重复实验，新旧肥料组的生长速度几乎相同。","重复观察可能支持关联稳定，但原有混杂可能依旧；这并不直接削弱主张。","主观不喜欢不等于目标效果没有改善，缺少指标连接。"],"hint":"先找两组之间除了所研究因素以外，还可能有哪些不同。","lesson":"证据有多强，结论就说到哪里。一个合理替代解释足以让“已经证明”需要重新审查。","level":2},{"id":"T11-001","topic":10,"family":"识别结论","title":"延长图书馆开放 · 识别结论","stem":"一位同学的论证：“不少同学晚饭后想借书，但图书馆那时已关门，所以学校应把图书馆晚间开放延长一小时。”\n这段论证试图让我们接受的主要结论是什么？","options":["学校应把图书馆晚间开放延长一小时","只要有人提出建议，建议就应该执行","不少同学晚饭后想借书，但图书馆那时已关门","所有类似措施都一定有效"],"answer":0,"steps":["前提：不少同学晚饭后想借书，但图书馆那时已关门。","结论：学校应把图书馆晚间开放延长一小时。","中间桥梁：确有一批同学能并愿意在新增时段到馆，且学校能承担相应管理成本。","若出现“试行期间新增时段几乎无人到馆，原因是学生无法离开宿舍”，桥梁就受到冲击；若出现“一周预约显示，有许多原本无法借书的学生会使用新增时段，而且值班资源已落实”，相关机制得到更直接支持。","加强只是提高可信度，通常还没有达到对所有情况的保证。"],"why":["与题目所问的“识别结论”直接对应：学校应把图书馆晚间开放延长一小时。","这是额外添加的规范，原文并未提供。","这是用来支持结论的观察或前提，不是“所以”之后要论证的主张。","把一个具体主张扩大成全称断言，原文没有这样说。"],"hint":"分别找出：观察到什么、想推出什么、两者之间缺哪一步。","lesson":"评价论证应针对前提、推导关系与相关证据，不以人气、身份或自信代替。","level":2},{"id":"T11-002","topic":10,"family":"隐含桥梁","title":"延长图书馆开放 · 隐含桥梁","stem":"一位同学的论证：“不少同学晚饭后想借书，但图书馆那时已关门，所以学校应把图书馆晚间开放延长一小时。”\n若要让这个推断成立，最需要补上的关 let startupWarning='';
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(validState(s))state=s;else startupWarning='保存的数据格式不兼容，已打开空白进度；原始数据未自动删除。';}}catch(e){startupWarning='当前浏览器未能读取保存数据，请使用备份功能保留练习记录。';}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));saveError=false;}catch(e){saveError=true;toast('无法保存到浏览器，请到“记录”备份进度。');}}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500);}
function latestMap(){const m=new Map();state.attempts.forEach(a=>m.set(a.id,a));return m;}
function reviewIds(){return [...latestMap()].filter(([id,a])=>!a.correct).map(([id])=>id);}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function controls(){return `<div class="controls"><label>每轮 <select id="size" aria-label="每轮题数">${[5,10,20].map(n=>`<option value="${n}" ${state.settings.size===n?'selected':''}>${n} 题</option>`).join('')}</select></label><label>难度 <select id="level" aria-label="难度">${[[0,'全部难度'],[2,'进阶 · 两步推理'],[3,'挑战 · 多步约束']].map(([n,s])=>`<option value="${n}" ${state.settings.level===n?'selected':''}>${s}</option>`).join('')}</select></label></div>`;}
function saveControls(){state.settings.size=Number($('size').value);state.settings.level=Number($('level').value);persist();}
function bindControls(){for(const id of ['size','level'])if($(id))$(id).onchange=()=>{saveControls();render();};}
function getPool(t=topic){return DATA.questions.filter(q=>(t<0||q.topic===t)&&(!state.settings.level||q.level===state.settings.level));}
function start(t=-1,mode='normal'){
 if(state.session){toast('有一轮未完成，请先继续或在首页结束该轮。');return;}
 const seen=latestMap();let pool=getPool(t);let label=t<0?'跨主题混合':DATA.topics[t].name;
 if(mode==='review'){pool=pool.filter(q=>reviewIds().includes(q.id));label='错题复习';}
 if(mode==='bookmark'){pool=pool.filter(q=>state.bookmarks.includes(q.id));label='收藏复习';}
 let fresh=shuffled(pool.filter(q=>!seen.has(q.id))),old=shuffled(pool.filter(q=>seen.has(q.id)));
 // Mixing topics avoids placing several variations from one family consecutively.
 function interleave(arr){let result=[];while(arr.length){let k=arr.findIndex(q=>!result.length||q.topic!==result[result.length-1].topic);result.push(arr.splice(k<0?0:k,1)[0]);}return result;}
 pool=mode==='normal'?[...interleave(fresh),...interleave(old)]:shuffled(pool);
 if(!pool.length){toast('当前筛选下没有题目，可调整难度或选择其他主题。');return;}
 state.session={ids:pool.slice(0,state.settings.size).map(q=>q.id),index:0,choice:null,submitted:false,hinted:false,results:[],label};persist();page='quiz';render(true);
}
function endSession(){if(!state.session)return;if(!confirm('结束本轮？已提交的答案仍会保留，未提交的选择不计入记录。'))return;lastSummary={label:state.session.label,results:state.session.results,planned:state.session.ids.length};state.session=null;persist();page='summary';render(true);}
function submit(){const s=state.session;if(!s||s.submitted)return;if(s.choice===null){$('answererror').textContent='请先点选一个答案。';return;}const q=Q.get(s.ids[s.index]);const a={id:q.id,choice:s.choice,correct:s.choice===q.answer,hinted:s.hinted,time:Date.now()};state.attempts.push(a);s.results.push(a);s.submitted=true;persist();render();const target=$('feedback');if(target){target.scrollIntoView({behavior:'auto',block:'start'});target.focus({preventScroll:true});}}
function next(){const s=state.session;if(!s||!s.submitted)return;if(s.index===s.ids.length-1){lastSummary={label:s.label,results:[...s.results],planned:s.ids.length};state.session=null;persist();page='summary';}else{s.index++;s.choice=null;s.submitted=false;s.hinted=false;}persist();render(true);}
function bookmark(id){if(state.bookmarks.includes(id))state.bookmarks=state.bookmarks.filter(x=>x!==id);else state.bookmarks.push(id);persist();render();}
function solution(q,choice){return `<section class="analysis"><h3>一步一步推导</h3><ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>四个选项，分别检查</h3>${q.options.map((o,i)=>`<div class="why"><strong>${letters[i]}. ${esc(o)} ${i===q.answer?'✓ 正确':''}${i===choice?' · 你的选择':''}</strong><p>${esc(q.why[i])}</p></div>`).join('')}<div class="notice"><strong>带走一个方法</strong><br>${esc(q.lesson)}</div></section>`;}
function home(){
 const m=latestMap(),right=[...m.values()].filter(a=>a.correct).length,wrong=reviewIds().length;
 $('app').innerHTML=`<div class="hero"><div><div class="kicker">LEVEL UP / 12 个主题 · 480 题</div><h1>多想一步。<br>答案就不一样。</h1><p>纯选择 · 无需打字。练多步推理、辨别证据与做出决策。答完立即看完整解析。</p><div class="row"><button class="primary" id="mixed">开始混合挑战 →</button>${state.session?'<button id="resume" class="primary">继续未完成的一轮</button>':''}</div></div><div class="mark">II<small>LOGIC LAB</small></div></div>
 ${startupWarning?`<div class="notice">${esc(startupWarning)}</div>`:''}${saveError?'<div class="notice">浏览器未能保存进度，请到记录页导出备份。</div>':''}
 <div class="stats"><div class="stat"><strong>${m.size}<small style="font-size:15px"> / 480</small></strong><span>已练习不同题目</span></div><div class="stat"><strong>${right}</strong><span>最近一次答对</span></div><div class="stat"><strong>${wrong}</strong><span>错题待复习</span></div></div>${controls()}
 ${state.session?`<div class="notice">未完成：${esc(state.session.label)} · 已提交 ${state.session.results.length}/${state.session.ids.length} 题。<button id="end" class="subtle">结束该轮</button></div>`:''}
 <div class="section"><h2>选择一块思考领域</h2><span class="muted">每主题 40 题</span></div><div class="grid">${DATA.topics.map(t=>{let n=[...m.keys()].filter(id=>Q.get(id).topic===t.id).length;return `<button class="topic" data-topic="${t.id}"><span class="num">${String(t.id+1).padStart(2,'0')} / THINKING SKILL</span><h3>${t.name}</h3><p>${t.desc}</p><div class="bar"><span style="width:${n/40*100}%"></span></div><div class="foot"><span>${n} / 40 已练习</span><span>进入 →</span></div></button>`;}).join('')}</div><p class="footertext">题库包含同方法的不同条件变式。首次练习优先安排未做题，已做题可反复练习。记录只保存在当前浏览器；两个版本分别保存进度。</p>`;
 $('mixed').onclick=()=>start(-1);if($('resume'))$('resume').onclick=()=>{page='quiz';render(true);};if($('end'))$('end').onclick=endSession;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=Number(b.dataset.topic);page='topic';render(true);});bindControls();
}
function topicPage(){let t=DATA.topics[topic],m=latestMap();let qs=getPool(topic),done=qs.filter(q=>m.has(q.id)).length;
 $('app').innerHTML=`<button id="back">← 主题地图</button><div class="kicker" style="margin-top:24px">主题 ${topic+1} / 共 40 题</div><h1>${t.name}</h1><p>${t.desc}</p><div class="notice">${t.method}</div>${controls()}<div class="card"><h3>当前筛选：${qs.length} 题</h3><p class="muted">其中 ${done} 题已做，${qs.length-done} 题未做。优先选择未做题。</p><button class="solid wide" id="starttopic">开始本主题 →</button></div><h2>这组题会练什么</h2><div class="row">${[...new Set(DATA.questions.filter(q=>q.topic===topic).map(q=>q.family))].map(f=>`<span class="chip">${f}</span>`).join('')}</div>`;$('back').onclick=()=>{page='home';render(true);};$('starttopic').onclick=()=>start(topic);bindControls();
}
function quiz(){const s=state.session;if(!s){page='home';home();return;}const q=Q.get(s.ids[s.index]);
 $('app').innerHTML=`<div class="quiz"><div class="quiztop"><button id="pause">← 暂停回首页</button><span class="muted">${esc(s.label)}<br>本轮 ${s.index+1} / ${s.ids.length}</span></div><div class="bar"><span style="width:${s.results.length/s.ids.length*100}%"></span></div><div class="row spaced"><span class="kicker">${DATA.topics[q.topic].name} / ${q.level===3?'挑战':'进阶'} · 单选</span><span class="muted">${q.id}</span></div><h2>${esc(q.title)}</h2><div class="card"><div class="stem">${esc(q.stem)}</div>${q.options.map((o,i)=>`<button class="opt ${s.submitted&&i===q.answer?'correct':''} ${s.submitted&&i===s.choice&&i!==q.answer?'wrong':''}" data-choice="${i}" aria-pressed="${s.choice===i}" ${s.submitted?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(o)}${s.submitted&&i===q.answer?'<span class="tag">正确答案</span>':''}${s.submitted&&i===s.choice?'<span class="tag">你的选择</span>':''}</span></button>`).join('')}
 ${!s.submitted?`<div id="answererror" class="error" role="alert"></div><div class="actions"><button id="hint">${s.hinted?'提示已展开':'给我一点提示'}</button><button class="solid" id="submit">确认答案，看解析 →</button></div>${s.hinted?`<div class="hint">${esc(q.hint)}</div>`:''}`:''}</div>
 ${s.submitted?`<div id="feedback" tabindex="-1" role="status" class="feedback ${s.choice===q.answer?'':'miss'}"><h3>${s.choice===q.answer?'判断正确。再看看推理是否一致。':'这题值得再想一步。'}</h3><p>正确选项：${letters[q.answer]} · ${esc(q.options[q.answer])}</p>${s.hinted?'<p class="muted">本题使用了提示。</p>':''}</div>${solution(q,s.choice)}<div class="actions"><button id="bookmark">${state.bookmarks.includes(q.id)?'已收藏 · 取消收藏':'收藏这题'}</button><button class="solid" id="next">${s.index+1===s.ids.length?'完成本轮 →':'下一题 →'}</button></div>`:''}</div>`;
 $('pause').onclick=()=>{persist();page='home';render(true);};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(s.submitted)return;s.choice=Number(b.dataset.choice);persist();render();});if($('hint'))$('hint').onclick=()=>{s.hinted=true;persist();render();};if($('submit'))$('submit').onclick=submit;if($('next'))$('next').onclick=next;if($('bookmark'))$('bookmark').onclick=()=>bookmark(q.id);
}
function summary(){const s=lastSummary;if(!s){page='home';home();return;}const right=s.results.filter(a=>a.correct).length;
 $('app').innerHTML=`<div class="kicker">${esc(s.label)} · 本轮回顾</div><h1>把方法带走。</h1><div class="card"><div class="resultscore">${right} <span class="muted">/ ${s.results.length} 题答对</span></div><p>已完成 ${s.results.length}/${s.planned} 题 · ${s.results.filter(a=>a.hinted).length} 题使用提示</p><p class="muted">答对代表这次选对了，不等于已经完全掌握。遇到值得再看的题，可以收藏。</p><button class="solid" id="again">返回训练地图 →</button></div>${s.results.map(a=>`<details class="reviewitem"><summary>${a.correct?'✓':'↻'} ${esc(Q.get(a.id).title)} · ${a.id}</summary><p class="stem">${esc(Q.get(a.id).stem)}</p>${solution(Q.get(a.id),a.choice)}</details>`).join('')}`;$('again').onclick=()=>{page='home';render(true);};
}
function review(){const ids=reviewIds(),book=state.bookmarks;
 $('app').innerHTML=`<div class="kicker">再想一次</div><h1>把卡住的地方，<br>变成会用的方法。</h1><p>错题 ${ids.length} 道 · 收藏 ${book.length} 道。错题再次答对后自动移出，收藏题由你决定保留。</p>${controls()}<div class="row"><button id="reviewstart" class="solid" ${ids.length?'':'disabled'}>复习错题 →</button><button id="bookstart" ${book.length?'':'disabled'}>练习收藏 →</button></div>${ids.length||book.length?'':'<div class="card empty">还没有待复习的题。先完成一轮挑战。</div>'}<div class="section"><h2>待复习清单</h2><span class="muted">点开可直接读解析</span></div>${[...new Set([...ids,...book])].slice(0,80).map(id=>{let q=Q.get(id);return `<details class="reviewitem"><summary>${esc(q.title)} · ${id}</summary><span class="chip">${DATA.topics[q.topic].name}</span><p class="stem">${esc(q.stem)}</p>${solution(q,latestMap().get(id)?.choice)}<button data-book="${id}">${book.includes(id)?'取消收藏':'收藏'}</button></details>`;}).join('')}${new Set([...ids,...book]).size>80?'<p class="muted">清单展示前 80 题；点击复习会从全部符合条件的题中选取。</p>':''}`;
 $('reviewstart').onclick=()=>start(-1,'review');$('bookstart').onclick=()=>start(-1,'bookmark');document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>bookmark(b.dataset.book));bindControls();
}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function report(){return '逻辑实验室 II · 进阶学习记录\n'+new Date().toLocaleString('zh-CN')+'\n\n'+state.attempts.map(a=>{let q=Q.get(a.id);return `${q.id} ${q.title}\n${q.stem}\n我的选择：${letters[a.choice]} ${q.options[a.choice]}\n正确答案：${letters[q.answer]} ${q.options[q.answer]}\n结果：${a.correct?'答对':'待复习'}${a.hinted?'（使用提示）':''}\n解析：\n${q.steps.join('\n')}\n`;}).join('\n');}
function records(){const m=latestMap();$('app').innerHTML=`<div class="kicker">我的训练档案</div><h1>看见思考的积累。</h1><p>练过 ${m.size} 道不同题目 · 累计提交 ${state.attempts.length} 次</p><div class="row"><button id="export">导出文字记录</button><button id="backup">备份进度</button><button id="restore">恢复备份</button></div><div class="notice">数据只存在当前浏览器，不会自动同步。换手机或清除浏览器数据前，先备份；可用“恢复备份”转移到另一台设备。原版与进阶版备份不通用。</div>${state.attempts.length?state.attempts.slice(-60).reverse().map(a=>{let q=Q.get(a.id);return `<details class="reviewitem"><summary>${a.correct?'✓':'↻'} ${q.id} · ${esc(q.title)}</summary><p class="muted">${new Date(a.time).toLocaleString('zh-CN')} · ${a.hinted?'使用提示':'未使用提示'}</p><p class="stem">${esc(q.stem)}</p>${solution(q,a.choice)}</details>`;}).join(''):'<div class="card empty">完成第一题后，你的选择会保存在这里。</div>'}${state.attempts.length>60?'<p class="muted">页面显示最近 60 次，导出与备份包含全部记录。</p>':''}<details><summary>清除进阶版数据</summary><p class="muted">会清除本浏览器中进阶版的练习、收藏和未完成一轮。原版数据独立保存。</p><button class="danger" id="clear">清除进阶版数据</button></details>`;
 $('export').onclick=()=>download('logic-advanced-records.txt',report(),'text/plain;charset=utf-8');$('backup').onclick=()=>download('logic-advanced-backup.json',JSON.stringify(state,null,2),'application/json');$('restore').onclick=()=>$('import').click();$('clear').onclick=()=>{if(!confirm('确认清除进阶版的全部本地数据？建议先备份。此操作无法撤回。'))return;state={version:1,attempts:[],bookmarks:[],session:null,settings:{size:10,level:0}};persist();render();toast('进阶版数据已清除。');};
}
async function restoreFile(file){if(!file)return;try{if(file.size>10000000)throw Error('文件过大');const s=JSON.parse(await file.text());if(!validState(s))throw Error('这不是有效的进阶版备份');if(!confirm(`将用备份替换当前进阶版进度（备份含 ${s.attempts.length} 次作答）。是否继续？`))return;state=s;persist();page='records';render(true);toast('备份已恢复。');}catch(e){toast('恢复失败：'+e.message);}finally{$('import').value='';}}
function guide(){ $('app').innerHTML=`<div class="kicker">怎么玩 / 怎么想</div><h1>点选很轻。<br>思考可以很深。</h1><div class="card"><h3>每次一小轮</h3><p>建议先选 5 或 10 题。点一个答案，再点“确认答案，看解析”。没有倒计时，也不需要输入理由。遇到不熟悉的分数或概率，可先点提示，用纸画表或列举。</p><p>新题优先安排；同主题包含不同条件的变式，重点练会方法。错题重做答对后自动移出错题集。</p><h3>读解析的三个动作</h3><ol><li>先看你漏了哪个条件，或混淆了哪两个概念。</li><li>再看错误选项为什么不成立，尤其是反例。</li><li>最后想一想：改掉题目的一条条件，答案会不会变化？</li></ol><p>有些题只给出规则，所有判断都以题目规则为准。实验和论证题问“最能支持”“最能削弱”，不代表已经证明绝对真假。</p></div><h2>12 个方法提醒</h2>${DATA.topics.map(t=>`<div class="reviewitem"><h3>${t.name}</h3><p>${t.method}</p></div>`).join('')}<div class="card"><h3>周末亲子练习</h3><p>孩子选一道觉得有争议的题，家长也先独立作答，再一起读解析。讨论可以只围绕三句话：“我用了哪个条件？”“这个选项有什么反例？”“什么新证据会让我改答案？”</p><p class="muted">这是一套练习工具，答题成绩不用于测量智商或诊断学习能力。题库中的人物、设备和数据均为教学设定。</p><a href="../logic-lab/">打开原版逻辑实验室 ↗</a></div>`;}
function render(scroll=false){if(page==='home')home();else if(page==='topic')topicPage();else if(page==='quiz')quiz();else if(page==='summary')summary();else if(page==='review')review();else if(page==='records')records();else guide();document.querySelectorAll('nav [data-page]').forEach(b=>{b.setAttribute('aria-current',b.dataset.page===page?'page':'false');b.onclick=()=>{page=b.dataset.page;render(true);};});if(scroll)window.scrollTo({top:0,behavior:'auto'});}
$('import').onchange=e=>restoreFile(e.target.files[0]);render();
</script></body></html>
